<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>🇴🇲</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--gold:#f2c230}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 18px calc(28px + env(safe-area-inset-bottom));
 font-family:Cairo,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;text-align:center;overflow-x:hidden;background:#030a1a}
body.prank{background:radial-gradient(120% 80% at 50% 0%,#e8314b,var(--red) 45%,#6d0716)}
body.clue{background:radial-gradient(120% 80% at 50% 0%,#1d4fb3,#0b2560 50%,#030a1a)}
.tag{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.25)}
.clue .tag{background:var(--gold);color:#1b1300}
h1{margin:0;font-size:clamp(34px,10vw,64px);line-height:1.05;text-wrap:balance}
p{margin:0;font-size:clamp(18px,5vw,24px);line-height:1.45;max-width:30ch;text-wrap:balance}
.media{width:min(560px,100%);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);border:4px solid rgba(255,255,255,.85);background:#000}
.clue .media{border-color:var(--gold)}
.media img,.media video{display:block;width:100%;height:auto;max-height:60svh;object-fit:contain;background:#000}
.unmute{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;min-height:48px;padding:10px 20px;background:#fff;color:#111;cursor:pointer}
.big{font-size:clamp(64px,22vw,120px);line-height:1}
.none{font:700 28px system-ui,sans-serif}
@media(prefers-reduced-motion:no-preference){h1,.big{animation:pop .6s cubic-bezier(.2,1.4,.5,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}}
</style></head>
<body><div class="none" id="msg"></div>
<script>
{
const none=()=>{document.body.className='';document.body.innerHTML='<div class="none">Nothing here 👀</div>'};
const t=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
(async()=>{try{
 const h=location.hash.slice(1);if(!h)return none();
 const raw=Uint8Array.from(atob(h.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-h.length%4)%4)),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const dec=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;const b=new Uint8Array(await r.arrayBuffer());return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))};
 const c=JSON.parse(new TextDecoder().decode(await dec('c.bin')));
 if(c.type==='redirect'){document.getElementById('msg').textContent='Loading your answer…';location.replace(c.url);return}
 history.replaceState(null,'',location.pathname);
 let media='';
 if(c.type==='video'||c.type==='picture'){const m=await dec('m.bin');const url=URL.createObjectURL(new Blob([m],{type:c.mime}));
  media=c.type==='video'?`<div class="media"><video src="${url}" autoplay muted loop playsinline controls></video></div><button class="unmute" id="um">🔊 Tap for sound</button>`
   :`<div class="media"><img src="${url}" alt=""></div>`}
 else media=`<div class="big">${c.kind==='prank'?'😜':'🔑'}</div>`;
 document.body.className=c.kind==='clue'?'clue':'prank';
 document.body.innerHTML=`<span class="tag">${c.kind==='clue'?'Clue found':'Hidden code'}</span>${c.title?`<h1>${t(c.title)}</h1>`:''}${media}${c.text?`<p>${t(c.text)}</p>`:''}`;
 const um=document.getElementById('um');if(um)um.onclick=()=>{const v=document.querySelector('video');v.muted=false;v.currentTime=0;v.play();um.remove()};
}catch(e){none()}})();
}
</script></body></html>
